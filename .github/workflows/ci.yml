name: CI
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm test
      - run: npm run test:types
      - run: npm run generate-wire-schema && npm run generate-response-types
      - run: git diff --exit-code -- lib/wire-schema.json types/responses.d.ts
  packed-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:consumer
