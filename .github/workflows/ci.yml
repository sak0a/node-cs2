name: CI
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  offline:
    # Runner pool routing: CI_* repository variables pick the runner; the literal is the default.
    runs-on: ${{ fromJSON(format(vars.CI_LINUX || '["ubuntu-latest"]', github.run_id, github.run_attempt)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm test
      - run: npm run test:types
      - run: npm run generate-wire-schema && npm run generate-response-types
      - run: git diff --exit-code -- lib/wire-schema.json types/responses.d.ts
  packed-consumers:
    runs-on: ${{ fromJSON(format(vars.CI_LINUX || '["ubuntu-latest"]', github.run_id, github.run_attempt)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run test:consumer
